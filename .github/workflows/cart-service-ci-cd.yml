name: Cart Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/cart-service/**'
      - 'shared/**'
      - '.github/actions/sam-deploy/**'
      - '.github/workflows/cart-service-ci-cd.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  INFRA_STACK_NAME: ${{ vars.INFRA_STACK_NAME || 'sam-multistack-infra' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy cart service
        uses: ./.github/actions/sam-deploy
        with:
          service-path: services/cart-service
          stack-name: sam-multistack-cart-service
          infra-stack-name: ${{ env.INFRA_STACK_NAME }}
          aws-region: ${{ env.AWS_REGION }}
