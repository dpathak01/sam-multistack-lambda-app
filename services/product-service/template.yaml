AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Product domain service stack.

Parameters:
  SharedRestApiId:
    Type: String
  SharedRestApiRootResourceId:
    Type: String
  ApiStageName:
    Type: String
    Default: prod

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Handler: index.handler
    Layers:
      - !Ref SharedCommonLayer
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:
  SharedCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: product-service-common
      ContentUri: ../../shared/layers/common
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/list-products.handler
      Description: Lists all available products.
      Environment:
        Variables:
          SERVICE_NAME: product-service
          TABLE_NAME: !Ref ProductsTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt ProductsTable.Arn

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SharedRestApiId
      ParentId: !Ref SharedRestApiRootResourceId
      PathPart: products

  ListProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SharedRestApiId
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListProductsFunction.Arn}/invocations

  ListProductsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ListProductsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SharedRestApiId}/*/GET/products

  ProductServiceDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ListProductsMethod
    Properties:
      RestApiId: !Ref SharedRestApiId
      StageName: !Ref ApiStageName
      Description: Deployment triggered by the product service stack.

Outputs:
  ProductsTableName:
    Value: !Ref ProductsTable
  ProductsPath:
    Value: !Sub /${ApiStageName}/products

