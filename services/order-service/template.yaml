AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Order domain service stack.

Parameters:
  SharedRestApiId:
    Type: String
  SharedRestApiRootResourceId:
    Type: String
  ApiStageName:
    Type: String
    Default: prod

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Handler: index.handler
    Layers:
      - !Ref SharedCommonLayer
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:
  SharedCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: order-service-common
      ContentUri: ../../shared/layers/common
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/create-order.handler
      Description: Creates an order in the order table.
      Environment:
        Variables:
          SERVICE_NAME: order-service
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt OrdersTable.Arn

  ListOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/list-orders.handler
      Description: Lists all orders from the order table.
      Environment:
        Variables:
          SERVICE_NAME: order-service
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt OrdersTable.Arn

  OrderResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SharedRestApiId
      ParentId: !Ref SharedRestApiRootResourceId
      PathPart: order

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SharedRestApiId
      ParentId: !Ref SharedRestApiRootResourceId
      PathPart: orders

  CreateOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SharedRestApiId
      ResourceId: !Ref OrderResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateOrderFunction.Arn}/invocations

  ListOrdersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SharedRestApiId
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListOrdersFunction.Arn}/invocations

  CreateOrderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateOrderFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SharedRestApiId}/*/POST/order

  ListOrdersPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ListOrdersFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SharedRestApiId}/*/GET/orders

  OrderServiceDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateOrderMethod
      - ListOrdersMethod
    Properties:
      RestApiId: !Ref SharedRestApiId
      StageName: !Ref ApiStageName
      Description: Deployment triggered by the order service stack.

Outputs:
  OrdersTableName:
    Value: !Ref OrdersTable
  OrderCreatePath:
    Value: !Sub /${ApiStageName}/order
  OrdersListPath:
    Value: !Sub /${ApiStageName}/orders

